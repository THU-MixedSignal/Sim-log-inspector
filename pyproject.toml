[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectre-log-inspector"
version = "0.3.0"
description = "Read-only, incremental Spectre evidence monitor for catching problems early"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
simcheck = "simcheck.cli:main"

[tool.setuptools.package-data]
simcheck = ["web/*.html", "web/*.js", "web/*.css"]
