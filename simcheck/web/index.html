<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spectre 运行监视</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
</head>
<body>
<header class="bar">
  <h1 class="brand">Spectre 运行监视</h1>
  <p class="collector" id="collector" role="status">连接中</p>
  <button id="notify" class="quiet-button" type="button" aria-pressed="false">提醒</button>
  <button id="pause" class="quiet-button" type="button" aria-pressed="false">暂停</button>
</header>
<div id="banner" class="banner" role="alert" hidden></div>
<main class="layout">
  <nav class="rail" aria-label="运行"><ul id="runs" class="runs"></ul></nav>
  <article class="detail">
    <p class="empty-state" id="empty" hidden>还没有运行数据。</p>
    <div id="run-view" hidden>
      <header class="run-head">
        <h2 class="run-title" id="run-title"></h2>
        <span class="run-state" id="run-state"></span>
        <span class="chips" id="run-chips"></span>
        <button id="ack" class="quiet-button" type="button" hidden></button>
      </header>
      <p class="facts" id="facts"></p>
      <div id="timeline-box"><svg id="timeline" class="timeline" role="img" aria-label="仿真时间轴"></svg></div>
      <div class="tabs" role="tablist" aria-label="运行详情">
        <button class="tab" role="tab" id="tab-problems" aria-controls="panel-problems" data-tab="problems">问题</button>
        <button class="tab" role="tab" id="tab-measurements" aria-controls="panel-measurements" data-tab="measurements">测量</button>
        <button class="tab" role="tab" id="tab-details" aria-controls="panel-details" data-tab="details">详情</button>
      </div>
      <section class="panel" role="tabpanel" id="panel-problems" aria-labelledby="tab-problems"></section>
      <section class="panel" role="tabpanel" id="panel-measurements" aria-labelledby="tab-measurements" hidden>
        <table class="data-table">
          <thead><tr><th scope="col">帧</th><th scope="col">码字</th><th scope="col">valid</th><th scope="col"><span class="sr-only">原文</span></th></tr></thead>
          <tbody id="measure-body"></tbody>
        </table>
        <p class="panel-row"><span id="measure-note"></span><button id="measure-earlier" class="quiet-button" type="button">更早</button></p>
      </section>
      <section class="panel" role="tabpanel" id="panel-details" aria-labelledby="tab-details" hidden></section>
    </div>
  </article>
</main>
<div id="live" class="sr-only" aria-live="polite"></div>
<div id="tooltip" class="tooltip" role="tooltip" hidden></div>
</body>
</html>
