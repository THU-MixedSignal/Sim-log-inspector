<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spectre Log Inspector</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
</head>
<body>
<header class="bar">
  <h1 class="brand">Spectre Log Inspector</h1>
  <p class="collector" id="collector" role="status">Connecting</p>
  <button id="notify" class="quiet-button" type="button" aria-pressed="false">Notifications</button>
  <button id="pause" class="quiet-button" type="button" aria-pressed="false">Pause updates</button>
</header>
<div id="banner" class="banner" role="alert" hidden></div>
<main class="layout">
  <aside class="run-panel">
    <div class="run-picker">
      <label class="sr-only" for="run-select">Run</label>
      <select id="run-select"></select>
    </div>
    <nav class="rail" aria-label="Runs"><ul id="runs" class="runs"></ul></nav>
  </aside>
  <article class="detail">
    <p class="empty-state" id="empty" hidden>No run data yet.</p>
    <div id="run-view" hidden>
      <header class="run-head">
        <h2 class="run-title" id="run-title"></h2>
        <span class="run-state" id="run-state"></span>
        <span class="chips" id="run-chips"></span>
        <button id="ack" class="quiet-button" type="button" hidden></button>
      </header>
      <p class="run-meta" id="facts"></p>
      <p class="run-error" id="run-error" hidden></p>
      <div id="timeline-box">
        <p class="progress-meta" id="progress" title="Latest logged simulation time"></p>
        <svg id="timeline" class="timeline" role="img" aria-label="Simulation timeline"></svg>
      </div>
      <div class="tabs" role="tablist" aria-label="Run details">
        <button class="tab" role="tab" id="tab-problems" aria-controls="panel-problems" data-tab="problems">Problems</button>
        <button class="tab" role="tab" id="tab-measurements" aria-controls="panel-measurements" data-tab="measurements">Measurements</button>
        <button class="tab" role="tab" id="tab-details" aria-controls="panel-details" data-tab="details">Details</button>
      </div>
      <section class="panel" role="tabpanel" id="panel-problems" aria-labelledby="tab-problems"></section>
      <section class="panel" role="tabpanel" id="panel-measurements" aria-labelledby="tab-measurements" hidden>
        <table class="data-table">
          <thead><tr><th scope="col">Frame</th><th scope="col">Code</th><th scope="col">valid</th><th scope="col">Evidence</th></tr></thead>
          <tbody id="measure-body"></tbody>
        </table>
        <p class="panel-row"><span id="measure-note"></span><button id="measure-earlier" class="quiet-button" type="button">Earlier</button></p>
      </section>
      <section class="panel" role="tabpanel" id="panel-details" aria-labelledby="tab-details" hidden></section>
    </div>
  </article>
</main>
<div id="live" class="sr-only" aria-live="polite"></div>
<div id="tooltip" class="tooltip" role="tooltip" hidden></div>
</body>
</html>
